name: Release

# Builds release artifacts when a version tag (v1.2.3) is pushed and publishes
# them as a GitHub Release. Stage 1 skeleton: Windows ships a zipped .exe for now;
# the Inno Setup per-user installer arrives in stage 8.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP_NAME: Cool Metronome
  BIN_NAME: cool-metronome

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p cm-app --release --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $ver = "${{ github.ref_name }}"
          Copy-Item "target/x86_64-pc-windows-msvc/release/$env:BIN_NAME.exe" "dist/CoolMetronome.exe"
          Copy-Item LICENSE-MIT, LICENSE-APACHE, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "CoolMetronome-$ver-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: CoolMetronome-*-windows-x64.zip

  macos:
    name: macOS universal
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p cm-app --release --target x86_64-apple-darwin
      - run: cargo build -p cm-app --release --target aarch64-apple-darwin
      - name: Bundle .app and .dmg (ad-hoc signed)
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          APP="dist/dmg/${APP_NAME}.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create \
            "target/x86_64-apple-darwin/release/${BIN_NAME}" \
            "target/aarch64-apple-darwin/release/${BIN_NAME}" \
            -output "$APP/Contents/MacOS/${BIN_NAME}"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>${APP_NAME}</string>
            <key>CFBundleDisplayName</key><string>${APP_NAME}</string>
            <key>CFBundleIdentifier</key><string>io.github.coolmetronome</string>
            <key>CFBundleExecutable</key><string>${BIN_NAME}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VER}</string>
            <key>CFBundleVersion</key><string>${VER}</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "$APP"
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "${APP_NAME}" -srcfolder dist/dmg -ov -format UDZO \
            "CoolMetronome-${GITHUB_REF_NAME}-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: CoolMetronome-*-macos-universal.dmg

  publish:
    name: Publish GitHub Release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
