[workspace]
resolver = "3"
members = [
    "crates/cm-core",
    "crates/cm-engine",
    "crates/cm-audio",
    "crates/cm-export",
    "crates/cm-app",
    "crates/cm-probe",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/labovich/cool_metronome"
authors = ["Cool Metronome contributors"]

[workspace.dependencies]
cm-core = { path = "crates/cm-core" }
cm-engine = { path = "crates/cm-engine" }
cm-audio = { path = "crates/cm-audio" }

# Audio output and the lock-free queue between UI and audio threads.
cpal = "0.18"
rtrb = "0.4"

# GUI: glow (OpenGL) backend instead of the default wgpu — smaller binary, less RAM.
# No egui default fonts: the app embeds a small Inter subset instead.
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "accesskit",
    "wayland",
    "x11",
] }
egui = "0.37"

# UI strings (Fluent).
fluent-bundle = "0.16"
unic-langid = "0.9"

# Data files: rhythm library, user settings.
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["std", "serde", "parse", "display"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
float_cmp = "warn"
cast_possible_truncation = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Fast UI iteration in debug builds, still reasonably optimized dependencies.
[profile.dev.package."*"]
opt-level = 2
